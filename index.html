<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE PANAIKANG FAMILY</title>
    <style>
        /* Pengaturan Warna Tema (Default Terang) */
        :root {
            --bg-color: #ffffff;
            --text-color: #2c3e50;
            --card-bg: #f8f9fa;
            --accent-color: #2ecc71;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        /* Pengaturan Warna saat Mode Gelap Aktif */
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #ffffff;
            --card-bg: #1e1e1e;
            --accent-color: #f1c40f;
            --shadow: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: all 0.4s ease;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Tombol Fitur Canggih Dark Mode */
        .btn-toggle {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 6px var(--shadow);
            transition: 0.2s;
        }
        .btn-toggle:active {
            transform: scale(0.95);
        }

        /* Desain Logo Baru */
        .logo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            margin-top: 25px;
            border: 4px solid var(--accent-color);
            box-shadow: 0 4px 15px var(--shadow);
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 1px;
            margin-top: 15px;
            text-transform: uppercase;
        }

        .motto {
            font-style: italic;
            opacity: 0.8;
        }

        /* Galeri Foto Konten */
        .gallery {
            margin-top: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 10px var(--shadow);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }

        footer {
            margin-top: 50px;
            font-size: 0.8rem;
            opacity: 0.6;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <button class="btn-toggle" id="themeToggle">🌙 MODE GELAP</button>

        <img src="logobaru.jpg" alt="Logo Keluarga" class="logo">

        <h1>THE PANAIKANG FAMILY</h1>
        <p class="motto">"Saling menjaga, selalu bersama, selamanya kompak."</p>

        <div class="gallery">
            <div class="card">
                <img src="konten1.jpg" alt="Dokumentasi 1">
                <p>Momen Kebersamaan 1</p>
            </div>
            <div class="card">
                <img src="konten2.jpg" alt="Dokumentasi 2">
                <p>Momen Kebersamaan 2</p>
            </div>
        </div>

        <footer>
            &copy; 2026 THE PANAIKANG FAMILY. Created by Aditya.
        </footer>
    </div>

    <script>
        const toggleButton = document.getElementById('themeToggle');
        toggleButton.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                toggleButton.textContent = '🌙 MODE GELAP';
                toggleButton.style.color = '#ffffff';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                toggleButton.textContent = '☀️ MODE TERANG';
                toggleButton.style.color = '#121212';
            }
        });
    </script>

</body>
</html>
